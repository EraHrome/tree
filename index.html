<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Родословная Полковниковых</title>
<style>
  :root {
    --paper: #f3eee6;
    --ink: #2c261f;
    --muted: #6e6256;
    --line: #8d7360;
    --link: #124ea0;
    --pat: #e7f0fa;
    --pat-edge: #2a568c;
    --mat: #e6f3e7;
    --mat-edge: #2e6e40;
    --self: #5c4028;
    --war: #fff1e6;
    --war-edge: #a04820;
    --sib: #fff8e8;
    --sib-edge: #a87624;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
  }
  header {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    flex-wrap: wrap;
    gap: 12px 20px;
    align-items: center;
    padding: 14px 22px;
    background: rgba(243, 238, 230, 0.94);
    border-bottom: 1px solid #e0d5c6;
  }
  h1 { font-size: 20px; margin: 0; font-weight: 650; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  button, .tools label {
    font: inherit;
    font-size: 13px;
    border: 1px solid #cbbba8;
    background: #fff;
    color: var(--ink);
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
  }
  button:hover { background: #fffaf3; }
  #viewport { height: calc(100% - 74px); overflow: auto; padding: 28px 24px 80px; }
  #canvas { transform-origin: top left; width: max-content; }
  .node { display: flex; align-items: flex-start; }
  .pair { display: flex; flex-direction: column; position: relative; margin-left: 18px; }
  .prow { position: relative; display: flex; align-items: flex-start; padding: 8px 0 8px 18px; }
  .prow::before {
    content: "";
    position: absolute;
    left: 0;
    width: 2px;
    background: var(--line);
  }
  .prow:first-child::before { top: 36px; bottom: 0; }
  .prow:last-child::before { top: 0; height: 36px; }
  .prow:only-child::before { display: none; }
  .prow::after {
    content: "";
    position: absolute;
    left: 0;
    top: 36px;
    width: 18px;
    height: 2px;
    background: var(--line);
  }
  .prow:only-child::after { width: 18px; }
  .anc-line { width: 22px; height: 2px; background: var(--line); flex: none; margin-top: 36px; }
  .card {
    width: 230px;
    background: #fff;
    border: 2px solid #c8b8a6;
    border-radius: 12px;
    padding: 10px 12px 8px;
    box-shadow: 0 1px 0 rgba(60, 40, 20, 0.04);
  }
  .card.pat { background: var(--pat); border-color: var(--pat-edge); }
  .card.mat { background: var(--mat); border-color: var(--mat-edge); }
  .card.self { background: var(--self); border-color: var(--self); color: #fff; }
  .card.war { background: var(--war); border-color: var(--war-edge); }
  .card .sur { font-weight: 700; font-size: 14px; line-height: 1.25; }
  .card a.sur { color: var(--link); text-decoration: underline; text-underline-offset: 2px; }
  .card.self a.sur { color: #d6e6ff; }
  .card .given, .card .meta, .card .note { font-size: 12px; line-height: 1.35; color: var(--muted); margin-top: 2px; }
  .card.self .given, .card.self .meta, .card.self .note { color: rgba(255,255,255,0.88); }
  .card .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .card button, .card summary {
    font-size: 12px;
    padding: 3px 7px;
    border-radius: 999px;
    border: 1px solid #d7c7b6;
    background: rgba(255,255,255,0.7);
    color: var(--ink);
    list-style: none;
    cursor: pointer;
  }
  .card.self button { color: var(--ink); }
  details.sibs summary { display: inline-block; }
  details.sibs summary::-webkit-details-marker { display: none; }
  .sib-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .sib {
    background: var(--sib);
    border: 1px solid var(--sib-edge);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 12px;
    line-height: 1.3;
  }
  .sib a { color: var(--link); }
  .legend { display: flex; gap: 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; border: 2px solid; }
  dialog {
    width: min(640px, calc(100% - 32px));
    border: none;
    border-radius: 14px;
    padding: 22px 24px 18px;
    color: var(--ink);
    box-shadow: 0 16px 50px rgba(40, 24, 8, 0.25);
  }
  dialog::backdrop { background: rgba(40, 28, 16, 0.35); }
  dialog h2 { margin: 0 0 8px; font-size: 20px; }
  dialog h3 { margin: 16px 0 4px; font-size: 14px; }
  dialog p { margin: 0 0 6px; font-size: 14px; line-height: 1.45; }
  dialog a { color: var(--link); }
  dialog menu { margin: 16px 0 0; padding: 0; text-align: right; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Родословная Полковниковых</h1>
    <p>Слева вы, справа предки. Синяя фамилия подчёркнута — карточку можно открыть. В скобках девичья фамилия.</p>

    <span><i class="sw" style="background:var(--war);border-color:var(--war-edge)"></i>воевал</span>
    <span><i class="sw" style="background:var(--self);border-color:var(--self)"></i>вы</span>
  </div>
  <div class="tools">
    <button type="button" id="zoom-out">−</button>
    <button type="button" id="zoom-in">+</button>
    <button type="button" id="zoom-reset">100%</button>
    <button type="button" id="toggle-sibs">Братья и сёстры</button>
  </div>
</header>
<div id="viewport"><div id="canvas"></div></div>
<dialog id="war">

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c];
  });
}
function surHtml(surname, url, self) {
  if (!url) return '<div class="sur">' + esc(surname) + "</div>";
  return '<a class="sur" href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(surname) + "</a>";
}
function card(p) {
  let actions = "";
  if (p.sibs.length) {
    const items = p.sibs.map(function (s) {
      const name = s.url
        ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.surname) + "</a>"
        : esc(s.surname);
      const warBtn = s.war ? ' <button type="button" data-war="' + esc(s.war) + '">служба</button>' : "";
      return '<div class="sib"><b>' + name + "</b><br>" + esc(s.given) + "<br>" + esc(s.meta) + warBtn + "</div>";
    }).join("");
    actions += '<details class="sibs"><summary>братья и сёстры, ' + p.sibs.length + "</summary><div class=\"sib-list\">" + items + "</div></details>";
  }
  if (p.war) actions += '<button type="button" data-war="' + esc(p.war) + '">служба</button>';
  const note = p.note ? '<div class="note">' + esc(p.note) + "</div>" : "";
  const act = actions ? '<div class="actions">' + actions + "</div>" : "";
  return '<div class="card ' + p.kind + '">' + surHtml(p.surname, p.url) +
    '<div class="given">' + esc(p.given) + "</div>" +
    '<div class="meta">' + esc(p.meta) + "</div>" + note + act + "</div>";
}
function render(p) {
  let tail = "";
  if (p.parents.length === 1) {
    tail = '<div class="anc-line"></div>' + render(p.parents[0]);
  } else if (p.parents.length === 2) {
    tail = '<div class="anc-line"></div><div class="pair">' +
      '<div class="prow">' + render(p.parents[0]) + "</div>" +
      '<div class="prow">' + render(p.parents[1]) + "</div></div>";
  }
  return '<div class="node">' + card(p) + tail + "</div>";
}

document.getElementById("canvas").innerHTML = render(tree);

const canvas = document.getElementById("canvas");
let zoom = 1;
function applyZoom() {
  canvas.style.transform = "scale(" + zoom + ")";
}
document.getElementById("zoom-in").onclick = function () { zoom = Math.min(1.6, zoom + 0.1); applyZoom(); };
document.getElementById("zoom-out").onclick = function () { zoom = Math.max(0.45, zoom - 0.1); applyZoom(); };
document.getElementById("zoom-reset").onclick = function () { zoom = 1; applyZoom(); };

let sibsOpen = false;
document.getElementById("toggle-sibs").onclick = function () {
  sibsOpen = !sibsOpen;
  document.querySelectorAll("details.sibs").forEach(function (d) { d.open = sibsOpen; });
  this.textContent = sibsOpen ? "Скрыть братьев и сестёр" : "Братья и сёстры";
};

const dlg = document.getElementById("war");
document.getElementById("canvas").addEventListener("click", function (e) {
  const b = e.target.closest("[data-war]");
  if (!b) return;
  const w = wars[b.getAttribute("data-war")];
  document.getElementById("war-title").textContent = w.title;
  document.getElementById("war-body").innerHTML = w.html;
  dlg.showModal();
});
document.getElementById("war-close").onclick = function () { dlg.close(); };
